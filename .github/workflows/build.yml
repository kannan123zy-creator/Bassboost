
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BassBoostApp.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'BassBoostApp*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BassBoostApp ZIP not found in repository root."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          echo "Checking extracted files..."
          find extracted -maxdepth 4 -type f | head -80

          WRAPPER=$(find extracted -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper (gradlew) not found in ZIP."
            echo "Check that the ZIP contains the Android project."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BassBoost-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
